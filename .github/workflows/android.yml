name: Android APK

# Builds a real, installable debug APK. This can't be done in the sandboxed
# dev container (its network policy blocks dl.google.com, which is required
# to resolve the Android Gradle Plugin / Google Maven) — GitHub-hosted
# runners have normal internet access, so CI is where the actual build
# happens.
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build -w client

      - name: Sync Capacitor Android project
        working-directory: client
        run: npx cap sync android

      - name: Build debug APK
        working-directory: client/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: neiro-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
